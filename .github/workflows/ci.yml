name: CI Build & Preview Deploy

on:
  push:
    branches:
      - cursor/phase1/finish-site
      - ag/phase1/**
  pull_request:
    branches:
      - ag/phase1/**

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      
      - name: Lint
        working-directory: apps/web
        run: npm run lint || echo "Lint warnings (non-blocking)"
        continue-on-error: true
      
      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit || echo "Type check warnings (non-blocking)"
        continue-on-error: true
      
      - name: Build Next.js
        working-directory: apps/web
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: apps/web/.next
          retention-days: 1

  pdf-build:
    name: Generate PDFs & Screenshots
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      
      - name: Install Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: apps/web/.next
      
      - name: Start Next.js server
        working-directory: apps/web
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npm run start &
          sleep 10
          echo "Server started"
      
      - name: Generate PDFs and screenshots
        working-directory: apps/web
        env:
          PREVIEW_URL: "http://localhost:3000"
        run: npm run build:pdf
      
      - name: Create artifacts directory
        run: mkdir -p artifacts
      
      - name: Upload PDFs and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pdfs-and-screenshots
          path: artifacts/*
          retention-days: 7

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [build, pdf-build]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      
      - name: Deploy to Vercel Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VC_TOKEN_PREVIEW }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            cd apps/web
            vercel --token $VERCEL_TOKEN --yes --prod=false
          else
            echo "VC_TOKEN_PREVIEW not set, skipping preview deploy"
          fi
        continue-on-error: true

  tests:
    name: Tests (Optional)
    runs-on: ubuntu-latest
    needs: build
    if: false  # Disabled for Phase 1, enable in Phase 1b
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      
      - name: Run unit tests
        working-directory: apps/web
        run: npm run test:unit || echo "Unit tests failed (non-blocking)"
        continue-on-error: true
      
      - name: Install Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      
      - name: Run E2E tests
        working-directory: apps/web
        run: npm run test:e2e || echo "E2E tests failed (non-blocking)"
        continue-on-error: true

